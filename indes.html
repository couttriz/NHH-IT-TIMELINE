<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NHH IT Timeline</title>

    <link rel="icon" type="image/png" href="images (3).jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="transition-all duration-500 overflow-x-hidden dark">

    <div class="container mx-auto px-3 py-4 md:py-8 max-w-7xl">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 md:mb-10 gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl md:text-4xl font-extrabold text-indigo-600 dark:text-indigo-400 tracking-tight">
                    CALENDAR
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-xs md:text-sm font-medium italic">Lịch hoạt động của NHH IT Club</p>
            </div>
            
            <a id="open-sheet-btn" href="https://docs.google.com/spreadsheets/d/1F4ycI6FcyZzNqBkf7ahbFBiDn8XyHDb1TYgcdsQ-FzE/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-5 py-2.5 rounded-2xl shadow-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 transition-all active:scale-95 hover:brightness-110 cursor-pointer">
                <span class="text-base">📊</span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-700 dark:text-slate-200">Dữ Liệu Sheet</span>
            </a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 lg:items-start">
            
            <div id="calendar-card" class="lg:col-span-2 rounded-2xl md:rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden bg-white dark:bg-slate-900">
                <div id="calendar"></div>
            </div>

            <div id="deadline-card" class="lg:col-span-1 w-full rounded-2xl md:rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 flex flex-col overflow-hidden transition-all duration-300">
                
                <div class="p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                    <h2 class="text-lg md:text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <span>🎯</span> Mục Tiêu Dài Hạn
                    </h2>
                    <span class="bg-red-100 text-red-600 text-[10px] font-bold px-2.5 py-1 rounded-full animate-pulse tracking-wider">MỤC TIÊU LỚN</span>
                </div>
                
                <div id="deadline-list" class="p-4 flex-1 overflow-y-auto space-y-3 custom-scrollbar">
                    <div class="flex justify-center items-center h-full">
                        <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                </div>
                
            </div>

        </div>
    </div>

    <div id="event-modal" class="fixed inset-0 z-[9999] flex items-center justify-center hidden p-4">
        <div id="modal-overlay" class="absolute inset-0 bg-slate-900/70 backdrop-blur-sm"></div>
        <div class="relative w-full max-w-md transform transition-all scale-95 opacity-0 duration-300 bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl shadow-2xl overflow-hidden" id="modal-content">
            <div id="modal-accent" class="h-2 w-full bg-indigo-500"></div>
            <div class="p-5 md:p-8">
                <div class="flex justify-between items-start mb-5">
                    <h2 id="modal-title" class="text-xl md:text-2xl font-bold text-slate-800 dark:text-white leading-tight"></h2>
                    <button id="close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-3xl leading-none">&times;</button>
                </div>
                <div class="space-y-5">
                    <div class="flex flex-wrap items-center gap-4 text-slate-600 dark:text-slate-300">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">📅</span>
                            <p id="modal-date" class="font-semibold text-sm md:text-base"></p>
                        </div>
                        <div id="modal-status-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                        <p class="text-[10px] uppercase font-bold text-indigo-500 mb-2 tracking-widest text-left">Thông tin chi tiết</p>
                        <p id="modal-description" class="text-slate-700 dark:text-slate-200 text-sm md:text-base leading-relaxed text-left"></p>
                    </div>
                </div>
                <button id="btn-confirm" class="w-full mt-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all">
                    Xong
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
